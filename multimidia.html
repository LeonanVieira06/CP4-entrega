<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimídia — Leonan</title>
    <meta name="description" content="Portfólio pessoal de Leonan, estudante de Análise e Desenvolvimento de Sistemas.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
    <a class="pular-conteudo" href="#conteudo">Pular para o conteúdo principal</a>
    <header id="inicio">
        <h1>Leonan</h1>
        <p class="tagline">Vídeo, áudio e mapa</p>
        <svg class="arco-decorativo" viewBox="0 0 100 20" preserveAspectRatio="none" aria-hidden="true">
            <path d="M0 20 Q50 0 100 20 Z"></path>
        </svg>
        <nav aria-label="Navegação principal">
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="curriculo.html">Currículo</a></li>
                <li><a href="formulario.html">Contato</a></li>
                <li><a href="multimidia.html" aria-current="page">Multimídia</a></li>
                <li><a href="graficos.html">Gráficos</a></li>
            </ul>
        </nav>
        <div class="controle-acessibilidade">
            <button type="button" id="alternar-contraste" class="btn btn-outline-light btn-sm"
                aria-pressed="false" aria-label="Ativar modo de alto contraste">
                Alto contraste: desligado
            </button>
        </div>
    </header>

    <main id="conteudo" class="container">
        <section id="video" class="card shadow-sm mb-4 p-3 p-md-4">
            <h2>Vídeo</h2>
            <p>Conteúdo em vídeo disponível para reprodução.</p>
            <div class="midia-bloco">
                <video controls preload="metadata" aria-label="Vídeo de apresentação">
                    <source src="midia/Suite O Lago dos Cisnes (Scene I) - P. I. Tchaikovsky.mp4" type="video/mp4">
                    Seu navegador não oferece suporte à reprodução de vídeo.
                </video>
            </div>
        </section>
        <section id="audio" class="card shadow-sm mb-4 p-3 p-md-4">
            <h2>Áudio</h2>
            <div class="midia-bloco">
                <audio controls preload="metadata" aria-label="Reprodutor de áudio">
                    <source src="midia/audio.mpeg" type="audio/mpeg">
                    Seu navegador não oferece suporte à reprodução de áudio.
                </audio>
            </div>
        </section>
        <section id="video-externo" class="card shadow-sm mb-4 p-3 p-md-4">
            <h2>Vídeo incorporado</h2>
            <div class="moldura-iframe">
                <iframe src="https://www.youtube-nocookie.com/embed/EwFPB13wQvs"
                    title="Vídeo incorporado do YouTube" loading="lazy"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>
        </section>
        <section id="mapa" class="card shadow-sm mb-4 p-3 p-md-4">
            <h2>Localização</h2>
            <div class="moldura-iframe">
                <iframe src="https://www.openstreetmap.org/export/embed.html?bbox=-46.6550%2C-23.5450%2C-46.6250%2C-23.5250&amp;layer=mapnik"
                    title="Mapa da região central de São Paulo" loading="lazy"></iframe>
            </div>
        </section>
    </main>

<footer class="container-fluid">
        <p>Portfólio Pessoal — Projeto CP4</p>
        <p>São Paulo, SP — 2026</p>
        <a href="#inicio">Voltar ao início</a>
    </footer>
    <script src="js/site.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous" defer></script>
</body>

</html>
